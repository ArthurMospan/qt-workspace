name: Checks

# What AGENTS.md already says must hold, actually asked on every change.
#
# The repository is written around commands that fail: `npm run test:unit`
# fails while a component in src/components/ui is unreachable, while a variant
# has no preview, while a colour is not a token, while a documented `npm run …`
# does not exist. Every one of those was true — and none of them was ever asked
# unless somebody remembered to ask. 1065 assertions and four generated reports
# were an honour system, on a repository whose own memory says verified work
# goes straight to main.
#
# Nothing here touches the product: no deploy, no database, no writes. It runs
# the same four commands a person would run and reports what they said. Actions
# minutes are free and unmetered on a public repository, so this costs nothing
# but the wait.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A second push replaces the run in flight rather than queueing behind it.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Next.js does not run lint as part of the build, which is why this is
      # its own step rather than something the build would have caught.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Placeholders, not secrets. Static prerendering evaluates
      # src/lib/firebase.js, and the Firebase SDK refuses to construct an auth
      # instance from an empty apiKey — so /help, /errors and /_not-found fail
      # to export with no configuration at all. Nothing here reaches a network:
      # the build is checking that the code compiles and every page renders, and
      # the real values are supplied by Vercel at deploy time. Keeping them
      # inline rather than in repository secrets is deliberate — a NEXT_PUBLIC_*
      # value is shipped to every browser anyway, and a secret nobody can read
      # would make this workflow one more thing to set up.
      - name: Build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: build-only-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: example.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: example
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: example.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
        run: npm run build

  reports:
    name: Generated reports match the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # In this order on purpose: the later two read the earlier output.
      - name: Regenerate
        run: |
          npm run kit:scan
          npm run kit:drift
          npm run kit:audit
          npm run kit:colors
          npm run kit:a11y

      # A report is committed alongside the change that moved it. A difference
      # here means somebody changed the UI and did not re-run the scans, so the
      # committed reports describe a product that no longer exists.
      - name: Committed reports are current
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated reports are out of date. Run npm run kit:scan && npm run kit:drift && npm run kit:audit && npm run kit:colors && npm run kit:a11y, then commit the result."
            exit 1
          fi

  rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator is a Java program. The runner ships a JDK, but
      # naming it here means a change to the image surfaces as "no Java" rather
      # than as a rules suite that mysteriously stopped running.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # Split from the run below on purpose. The emulator is fetched from
      # Google on first use, and when that is folded into the same step a
      # download problem and a rules failure are the same red mark. Separated,
      # the job list says which of the two happened without opening a log.
      - name: Fetch the Firestore emulator
        run: npx firebase setup:emulators:firestore

      - name: Java and CLI versions
        run: |
          java -version
          npx firebase --version

      # Does emulators:exec work here at all? A demo-* project needs no login,
      # but that is the assumption most likely to be wrong on a runner with no
      # Firebase credentials — and if it is, the suite below can only fail in a
      # way that looks like the rules being wrong. The probe is a file rather
      # than an inline -e so that nothing here depends on nested shell quoting.
      - name: Emulator starts and answers
        run: |
          cat > emulator-probe.mjs <<'PROBE'
          const host = process.env.FIRESTORE_EMULATOR_HOST;
          if (!host) throw new Error('FIRESTORE_EMULATOR_HOST is unset inside emulators:exec');
          const response = await fetch(`http://${host}/`);
          console.log('emulator at', host, '->', response.status);
          PROBE
          npx firebase --project demo-quickteam emulators:exec --only firestore 'node emulator-probe.mjs'

      # Named explicitly as IPv4. The suite discovers the emulator through the
      # hub or falls back to `localhost:8080`, and on a Linux runner `localhost`
      # resolves to ::1 first while the emulator binds 127.0.0.1 — which is a
      # connection refused that looks like a rules failure. Harmless if the hub
      # was answering all along.
      - name: Rules against the emulator
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
        run: npm run test:rules:emulator
